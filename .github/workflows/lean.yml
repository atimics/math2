name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UPSTREAM_SHA: adc7f1241b42e322a6451854ab7e4b4c146bf78a

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk (full Mathlib cache needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - name: Vendored comparators match openai/math byte for byte
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/openai/math upstream
          git -C upstream checkout "$UPSTREAM_SHA" -- lean/ComparatorChallenges
          for f in Fidelity/Vendor/*.lean FidelityAlt/Vendor/*.lean; do
            diff -u "upstream/lean/ComparatorChallenges/$(basename "$f")" "$f"
          done
          rm -rf upstream

      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Build
        run: |
          set -o pipefail
          lake build Corollaries Fidelity FidelityAlt 2>&1 | tee build.log || {
            # Surface every Lean error as an annotation (readable via the checks API).
            python3 scripts/annotate.py build.log
            exit 1
          }

      - name: Axiom checker self-test
        run: python3 scripts/check_axioms.py --self-test

      - name: Axiom guard rejects sorry (negative test)
        run: |
          if lake env lean scripts/GuardNegative.lean > guard_neg.txt 2>&1; then
            echo "::error file=scripts/GuardNegative.lean::guard accepted a sorry"; exit 1
          fi
          grep -q "non-standard axioms: \[sorryAx\]" guard_neg.txt

      - name: Axiom audit (exact names, no sorry, no extra axioms)
        run: |
          set -o pipefail
          lake env lean scripts/Axioms.lean 2>&1 | tee axioms.txt || {
            python3 scripts/annotate.py axioms.txt; exit 1; }
          python3 scripts/check_axioms.py axioms.txt scripts/Axioms.lean 2>&1 | tee audit.txt || {
            echo "::error file=scripts/Axioms.lean::$(tr '\n' ' ' < audit.txt | cut -c1-3000)"; exit 1; }

      - name: Axiom audit, separately built FidelityAlt library
        run: |
          set -o pipefail
          lake env lean scripts/AxiomsAlt.lean 2>&1 | tee axioms_alt.txt || {
            python3 scripts/annotate.py axioms_alt.txt; exit 1; }
          python3 scripts/check_axioms.py axioms_alt.txt scripts/AxiomsAlt.lean 2>&1 | tee audit_alt.txt || {
            echo "::error file=scripts/AxiomsAlt.lean::$(tr '\n' ' ' < audit_alt.txt | cut -c1-3000)"; exit 1; }

      - name: Shared definitions across the two libraries are byte-identical
        run: python3 scripts/check_same_text.py

      - name: Expert-review reproducers (docs/review)
        run: |
          pip install --quiet sympy
          python3 scripts/review/nt9_density.py
          python3 scripts/review/tc4_apsp.py
          python3 scripts/review/cl1_idempotent.py
